[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewforge"
version = "0.1.0"
description = "Automated AI code review and repair for local Git projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "filelock>=3.16,<4",
  "httpx>=0.27,<1",
  "mcp>=1.9,<2",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
reviewforge = "app.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

