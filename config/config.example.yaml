# Copy to config.yaml. That file is ignored by Git.
server:
  host: 127.0.0.1
  port: 8787
paths:
  data_dir: ~/.reviewforge/data
security:
  code_egress_acknowledged: false
  allow_http_localhost: true
models:
  providers:
    - id: relay
      type: openai_compatible
      base_url: https://api.openai.com/v1
      api_key_env: REVIEWFORGE_API_KEY
      timeout_sec: 600
      max_retries: 3
      models:
        - id: your-model-id
          context_window: 128000
          max_output_tokens: 16000
          input_usd_per_1m: 0
          output_usd_per_1m: 0
  roles:
    reviewer: {provider: relay, model: your-model-id}
    fixer: {provider: relay, model: your-model-id}
context:
  max_file_bytes: 200000
  max_total_bytes: 8000000
limits:
  max_rounds: 3
  max_fix_attempts_per_round: 2
  max_total_tokens: 1000000
  max_cost_usd: 5
  max_wall_time_min: 120
automation:
  require_clean_worktree: true
  max_parallel_tasks: 1
  finalize:
    auto_commit: false
